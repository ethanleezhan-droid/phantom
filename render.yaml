# Render.com Blueprint — deploys the Phantom Wallet Simulator web app.
# In the Render dashboard: New +  ->  Blueprint  ->  pick this repo  ->  Apply.
services:
  - type: web
    name: phantom-wallet-simulator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      # Stable session key so logins survive restarts (auto-generated by Render).
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
